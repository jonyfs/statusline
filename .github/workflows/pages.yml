name: Help page

# Publishes help/ to GitHub Pages, so the help chip on line 3 can open it in
# the browser through an https link. A terminal treats a file:// link as a
# file-manager item, so a local page never opens in the browser from there.
on:
  push:
    branches: [main]
    paths:
      - "help/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: help
      - id: deployment
        uses: actions/deploy-pages@v4
