name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Principle IX requires this to pass on all three platforms, so the
    # matrix is the enforcement, not a nicety: a platform regression has
    # to fail here rather than on someone else's machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run smoke tests
        run: node scripts/smoke-test.js

      - name: Verify the CLI runs and renders
        shell: bash
        run: |
          echo '{"model":{"display_name":"Sonnet 5"},"context_window":{"used_percentage":42}}' \
            | node bin/cli.js render

      - name: Verify uninstall is a safe no-op when not installed
        run: node bin/cli.js uninstall

  previews-current:
    # Principle VIII: a README image that disagrees with the code is a
    # defect. Regenerating must produce no diff, which only holds if the
    # committed previews were regenerated alongside the last render change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate previews
        run: node scripts/generate-previews.js

      - name: Fail if previews are stale
        run: |
          if ! git diff --quiet -- docs/previews; then
            echo "::error::docs/previews is out of date. Run 'node scripts/generate-previews.js' and commit the result."
            git diff --stat -- docs/previews
            exit 1
          fi

  composer-current:
    # The same argument as the previews above, for the page the bar is
    # arranged on: it is generated from the renderer, so a committed copy
    # that disagrees with the code is a page somebody could make a decision
    # from and get a different bar.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the composer page
        run: node scripts/generate-composer.js

      - name: Fail if the page is stale
        run: |
          if ! git diff --quiet -- specs/004-statusline-redesign-research/composer.html; then
            echo "::error::composer.html is out of date. Run 'npm run composer' and commit the result."
            git diff --stat -- specs/004-statusline-redesign-research/composer.html
            exit 1
          fi

  clone-install:
    # The documented install is a bare clone with no package manager, which
    # only works while the project has zero runtime dependencies. This proves
    # a fresh clone runs, so a stray dependency can't slip in unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail if a runtime dependency was introduced
        run: |
          DEPS="$(node -p "Object.keys(require('./package.json').dependencies || {}).length")"
          if [ "$DEPS" != "0" ]; then
            echo "::error::The clone-based install requires zero runtime dependencies, found $DEPS."
            exit 1
          fi

      - name: Run straight from a clean checkout, as the README instructs
        run: |
          echo '{"model":{"display_name":"Sonnet 5"},"context_window":{"used_percentage":42}}' \
            | node bin/cli.js render
