name: Release

# A release is driven by a version tag, so the tag is the single source of
# truth for what was released. Nothing releases from a branch push: a green
# main must never be able to ship by accident.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    # The same gates CI runs, re-run against the exact tagged commit. A tag
    # can point at a commit that never went through a pull request, so
    # trusting CI's earlier verdict would leave a hole.
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/smoke-test.js

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fail if the tag disagrees with the recorded version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      - name: Create the GitHub release
        # Users install by cloning, so the release is the tag plus these
        # notes. There is no artifact to upload and no registry to push to.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
