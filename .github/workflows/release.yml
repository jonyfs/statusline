name: Release

# Publishing is driven by a version tag, so the tag is the single source of
# truth for what is on npm. Nothing publishes from a branch push: a green
# main must never be able to ship by accident.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    # The same gates CI runs, re-run against the exact tagged commit. A tag
    # can point at a commit that never went through a pull request, so
    # trusting CI's earlier verdict would leave a hole.
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # id-token lets npm verify this workflow's identity over OIDC, so no
      # long-lived npm token is stored in this repository at all.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Fail if the tag disagrees with package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION but package.json says $PKG_VERSION."
            exit 1
          fi
          echo "Publishing version $PKG_VERSION"

      - name: Fail if this version is already on npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::error::$PKG_NAME@$PKG_VERSION is already published. Bump the version."
            exit 1
          fi

      - name: Upgrade npm for OIDC trusted publishing
        # Trusted publishing needs npm >= 11.5.1; the npm bundled with the
        # Node 22 runner image predates it.
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
